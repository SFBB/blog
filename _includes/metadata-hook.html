<!-- Synchronous Language Mode Setup (Prevents FOUC) -->
<script>
  (function () {
    const STORAGE_KEY = 'pref-lang';
    let pref = localStorage.getItem(STORAGE_KEY);
    if (!pref) {
      const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      pref = browserLang.startsWith('zh') ? 'zh' : 'en';
    }
    document.documentElement.setAttribute('data-site-lang', pref);
  })();
</script>

<style>
  /* English / Default State */
  html:not([data-site-lang="zh"]) .lang-view[data-lang="zh"] {
    display: none !important;
  }
  html:not([data-site-lang="zh"]) span.lang-view[data-lang="en"] {
    display: inline !important;
  }
  html:not([data-site-lang="zh"]) div.lang-view[data-lang="en"],
  html:not([data-site-lang="zh"]) p.lang-view[data-lang="en"] {
    display: block !important;
  }

  /* Chinese State */
  html[data-site-lang="zh"] .lang-view[data-lang="en"] {
    display: none !important;
  }
  html[data-site-lang="zh"] span.lang-view[data-lang="zh"] {
    display: inline !important;
  }
  html[data-site-lang="zh"] div.lang-view[data-lang="zh"],
  html[data-site-lang="zh"] p.lang-view[data-lang="zh"] {
    display: block !important;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const STORAGE_KEY = 'pref-lang';

    // 1. Fallback for posts that only contain English content
    const zhViews = document.querySelectorAll('.content .lang-view[data-lang="zh"]');
    if (zhViews.length === 0) {
      const enViews = document.querySelectorAll('.content .lang-view[data-lang="en"]');
      enViews.forEach(function (el) {
        el.classList.remove('lang-view');
      });
    }

    function syncUI(lang) {
      document.documentElement.setAttribute('data-site-lang', lang);

      // Search input placeholder
      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.placeholder = (lang === 'zh') ? '搜索...' : 'Search...';
      }
    }

    const currentLang = document.documentElement.getAttribute('data-site-lang') || 'en';
    syncUI(currentLang);

    // 2. Language Switcher Button Listener
    const toggleBtn = document.getElementById('lang-toggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', function (e) {
        e.preventDefault();
        const cur = document.documentElement.getAttribute('data-site-lang') || 'en';
        const next = (cur === 'zh') ? 'en' : 'zh';
        localStorage.setItem(STORAGE_KEY, next);
        syncUI(next);
      });
    }
  });
</script>
