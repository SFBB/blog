<!-- Automatic Browser Language Detection & Manual Preference Persistence -->
<script>
  (function () {
    const STORAGE_KEY = 'pref-lang';
    const zhHome = '{{ "/zh/" | relative_url }}';
    const enHome = '{{ "/" | relative_url }}';

    function normalizePath(p) {
      if (!p) return '/';
      return p.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
    }

    // 1. Get saved preference or detect from browser
    let pref = localStorage.getItem(STORAGE_KEY);
    if (!pref) {
      const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      pref = browserLang.startsWith('zh') ? 'zh' : 'en';
    }

    // 2. Auto-redirect on the home entrance if needed
    const currentNorm = normalizePath(window.location.pathname);
    const isEnHome = currentNorm === normalizePath(enHome);
    const isZhHome = currentNorm === normalizePath(zhHome);

    if (isEnHome && pref === 'zh') {
      window.location.replace(zhHome);
    } else if (isZhHome && pref === 'en') {
      window.location.replace(enHome);
    }

    // 3. Listen for manual language toggle clicks to record explicit user preference
    document.addEventListener('DOMContentLoaded', function () {
      const toggleBtn = document.getElementById('lang-toggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
          const currentLang = '{{ lang }}';
          const nextLang = (currentLang === 'zh-CN' || currentLang === 'zh') ? 'en' : 'zh';
          localStorage.setItem(STORAGE_KEY, nextLang);
        });
      }
    });
  })();
</script>
